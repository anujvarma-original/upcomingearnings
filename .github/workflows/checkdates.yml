name: Daily Earnings Check

on:
  schedule:
    - cron: "0 13 * * *"

  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Streamlit earnings scanner
        run: |
          curl \
            --max-time 120 \
            --silent \
            --show-error \
            --output /dev/null \
            "https://upcomingearnings.streamlit.app/"
