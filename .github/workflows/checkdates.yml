name: Daily Earnings Check

on:
  schedule:
    - cron: "0 13 * * *"

  workflow_dispatch:

jobs:
  wake-streamlit:

    runs-on: ubuntu-latest

    steps:

      - name: Wake Streamlit earnings scanner
        run: |
          curl -L --max-time 120 \
          "https://upcomingearnings.streamlit.app/"
